# Local Nakama + Postgres for race-mode development (spec Phase 9).
#   npm run build:server          # bundle the match module first
#   docker compose -f docker-compose.nakama.yml up
# Client connects to localhost:7350, server key "defaultkey" (dev defaults
# in src/lib/net/nakama.ts — override with VITE_NAKAMA_* env vars).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: nakama
    volumes:
      - nakama-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 12

  nakama:
    image: heroiclabs/nakama:3.22.0
    entrypoint: >
      /bin/sh -c "/nakama/nakama migrate up
      --database.address postgres:localpassword@postgres:5432/nakama &&
      exec /nakama/nakama --name nakama1
      --database.address postgres:localpassword@postgres:5432/nakama
      --socket.server_key defaultkey
      --console.password password
      --logger.level INFO
      --socket.max_message_size_bytes 1048576"
    volumes:
      # Built match module — run `npm run build:server` after any server/ change.
      - ./server/build:/nakama/data/modules
    ports:
      - '7349:7349' # gRPC API
      - '7350:7350' # HTTP API + realtime socket (client connects here)
      - '7351:7351' # dev console
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nakama-db:
